<mat-card class="card" appearance="outlined">
    <div class="card__image">
        <span class="card__initial"> {{carro().marca.charAt(0)}} </span>
    </div>

    <mat-card-header>
        <mat-card-title>{{carro().nome}}</mat-card-title>
        <mat-card-subtitle>{{carro().marca}} {{carro().ano}}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
        <p class="card__price">{{carro().preco   | currency : 'BRL'}}</p>
    </mat-card-content>

    <mat-card-actions>
        <button mat-flat-button>Ver mais</button>
    </mat-card-actions>
</mat-card>
